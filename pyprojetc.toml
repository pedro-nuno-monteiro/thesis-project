# pyproject.toml - metadata + dependency management (PEP 621)
[project]
name = "your-package-name"
version = "0.1.0"
description = "Short description of the project."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    # Runtime dependencies (PEP 440 version specifiers)
    "requests>=2.28,<3.0",
    "numpy>=1.25,<2.0",
    "pydantic>=1.10,<2.0",
]

# Optional dependency groups (install with: pip install .[dev] or via tools that support extras)
[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "black>=24.0,<25.0",
    "isort>=5.0,<6.0",
    "mypy>=1.0,<2.0",
]
docs = [
    "sphinx>=6.0,<7.0",
    "sphinx-rtd-theme>=1.0,<2.0",
]

[project.urls]
"Homepage" = "https://example.org/your-project"
"Repository" = "https://github.com/yourname/your-project"

# Build system - adjust to your chosen backend (setuptools or poetry-core)
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"